<style>
/* Layout: barra lateral de módulos + área central de lectura; tablas y listas en lugar de tarjetas. */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface2:#EDF1EF; --fg:#18211F; --muted:#56635F; --line:#D5DDDA;
  --accent:#0F6B66; --on-accent:#FFFFFF;
  --accent-text:color-mix(in srgb,var(--accent) 80%,var(--fg));
  --accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));
  --pend:#6B7773; --dev:#A8680B; --ok:#1B7F46; --na:#4F63A0; --bad:#B3321F;
  --pend-soft:#ECEFEE; --dev-soft:#FBF0DC; --ok-soft:#E0F2E7; --na-soft:#E4E9F6; --bad-soft:#FAE6E2;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221F; --surface2:#202B28; --fg:#E6EDEA; --muted:#9AA9A4; --line:#2F3C38;
  --pend:#98A6A1; --dev:#E3A547; --ok:#5CC48A; --na:#8FA3E0; --bad:#F08A78;
  --pend-soft:#26302D; --dev-soft:#3A2F18; --ok-soft:#173326; --na-soft:#232B45; --bad-soft:#40201A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --surface2:#202B28; --fg:#E6EDEA; --muted:#9AA9A4; --line:#2F3C38;
  --pend:#98A6A1; --dev:#E3A547; --ok:#5CC48A; --na:#8FA3E0; --bad:#F08A78;
  --pend-soft:#26302D; --dev-soft:#3A2F18; --ok-soft:#173326; --na-soft:#232B45; --bad-soft:#40201A;
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-sans);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--f-serif);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.2}
h2{font-size:20px;line-height:1.3}
h3{font-size:15px;font-weight:600;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  padding:18px 14px 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-serif);font-size:16px;line-height:1.25}
.brand span{font-size:12.5px;color:var(--muted)}
.side-total{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-block:1px solid var(--line)}
.side-total .row{display:flex;justify-content:space-between;align-items:baseline}
.side-total .big{font-family:var(--f-mono);font-size:22px;font-weight:500}
nav{display:flex;flex-direction:column;gap:1px}
.nv{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:6px;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--fg)}
.nv:hover{background:var(--surface2)}
.nv[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nv .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nv .t{font-size:13.5px;line-height:1.3}
.nv .p{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nv .p.done{color:var(--ok);font-weight:600}

.navhead{margin:8px 8px 3px}
#side>*{flex-shrink:0}
.themeseg{display:flex}
.themeseg button{flex:1;padding:6px 8px;font-size:13px}
.themeseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.persist{font-size:12px;color:var(--muted);line-height:1.45;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}

.topbar{display:none}
.scrim{display:none}
.content{max-width:980px;margin-inline:auto;padding-block:30px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

.bar{height:8px;border-radius:4px;background:var(--surface2);display:flex;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)}.bar .d{background:var(--dev)}
.bar.sm{height:6px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent-text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.s-p{background:var(--pend-soft);color:var(--pend)}
.pill.s-d{background:var(--dev-soft);color:var(--dev)}
.pill.s-c{background:var(--ok-soft);color:var(--ok)}
.pill.s-n{background:var(--na-soft);color:var(--na)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.stat{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mrow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(90px,1.4fr) 80px 104px;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;width:100%;text-align:left}
.mrow:last-child{border-bottom:0}
button.mrow:hover{background:var(--surface2)}
.mrow .nm{display:flex;gap:10px;align-items:baseline;min-width:0}
.mrow .nm span:last-child{min-width:0}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.list li:last-child{border-bottom:0}
.linkbtn{background:none;border:0;padding:0;text-align:left;color:var(--accent-text);text-decoration:underline;text-underline-offset:2px}

.mhead{display:flex;flex-direction:column;gap:10px}
.mhead .kicker{font-family:var(--f-mono);font-size:12.5px;color:var(--accent-text)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;padding:14px 0;border-block:1px solid var(--line)}
.meta div{display:flex;flex-direction:column;gap:3px}
.fund{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 6px 6px 0}
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ghead .gid{font-family:var(--f-mono);color:var(--accent-text);font-size:13px}
.ghead .gp{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.req{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pend);border-radius:6px}
.req.s-d{border-left-color:var(--dev)}.req.s-c{border-left-color:var(--ok)}.req.s-n{border-left-color:var(--na)}
.rhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:9px 12px}
.rid{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rtitle{background:none;border:0;text-align:left;padding:2px 0;font-weight:500;display:flex;gap:8px;align-items:baseline;min-width:0}
.rtitle:hover{color:var(--accent-text)}
.rtitle .car{font-family:var(--f-mono);color:var(--muted);flex:none;transition:transform .15s}
.rtitle[aria-expanded="true"] .car{transform:rotate(90deg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);padding:5px 9px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface2)}
.seg button[aria-checked="true"].k-p{background:var(--pend);color:#fff}
.seg button[aria-checked="true"].k-d{background:var(--dev);color:#fff}
.seg button[aria-checked="true"].k-c{background:var(--ok);color:#fff}
.seg button[aria-checked="true"].k-n{background:var(--na);color:#fff}
:root[data-theme="dark"] .seg button[aria-checked="true"]{color:#101614}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-checked="true"]{color:#101614}}
.rbody{border-top:1px solid var(--line);padding:14px 14px 16px 16px;display:flex;flex-direction:column;gap:14px;background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 22px}
.dgrid>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.dgrid .crit{grid-column:1/-1;background:var(--accent-soft);padding:9px 12px;border-radius:6px}
.field{display:flex;flex-direction:column;gap:4px}
textarea,input[type=text]{font:inherit;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:8px 10px;resize:vertical}
textarea{min-height:64px}
.warn{color:var(--bad);font-size:12.5px;font-weight:500}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:baseline}
.alert:last-child{border-bottom:0}
.alert .tag{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--bad-soft);color:var(--bad);white-space:nowrap}
.alert .tag.up{background:var(--dev-soft);color:var(--dev)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.princ{counter-reset:p}
.princ li{counter-increment:p;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:baseline}
.princ li::before{content:counter(p,decimal-leading-zero);font-family:var(--f-mono);color:var(--accent-text);font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding:16px}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}

.svg-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.svg-wrap svg{display:block;min-width:660px;width:100%;height:auto}
svg .f{fill:var(--surface)} svg .f2{fill:var(--surface2)} svg .fa{fill:var(--accent)} svg .fas{fill:var(--accent-soft)} svg .fn{fill:none}
svg .s{stroke:var(--line);stroke-width:1} svg .sa{stroke:var(--accent);stroke-width:1.2} svg .serr{stroke:var(--bad);stroke-width:1.6}
svg .t{fill:var(--fg);font-family:var(--f-sans)}
svg .tm{fill:var(--muted)} svg .ta{fill:var(--on-accent)} svg .ac{fill:var(--accent-text)} svg .err{fill:var(--bad)} svg .ok{fill:var(--ok)} svg .dv{fill:var(--dev)}
svg .tb{font-weight:600} svg .mono{font-family:var(--f-mono)}
svg .mk{fill:var(--fg)} svg .mkt{fill:var(--bg);font-weight:600;font-family:var(--f-sans)}
svg .errbg{fill:var(--bad-soft)} svg .okbg{fill:var(--ok-soft)} svg .warnbg{fill:var(--dev-soft)} svg .nabg{fill:var(--na-soft)}
svg .ln{fill:var(--line)} svg .lna{fill:var(--accent)} svg .ov{fill:var(--fg);opacity:.4} svg .dot{fill:var(--line)}
svg .pl-c{fill:var(--ok-soft)} svg .pt-c{fill:var(--ok)} svg .pl-d{fill:var(--dev-soft)} svg .pt-d{fill:var(--dev)}
svg .pl-b{fill:var(--bad-soft)} svg .pt-b{fill:var(--bad)} svg .pl-n{fill:var(--na-soft)} svg .pt-n{fill:var(--na)} svg .pl-p{fill:var(--pend-soft)} svg .pt-p{fill:var(--pend)}
svg .arr{stroke:var(--muted);stroke-width:1.4;fill:none} svg .arrd{stroke-dasharray:5 4} svg .arrf{fill:var(--muted)}
svg .dash{stroke:var(--line);stroke-dasharray:4 4;fill:none}
.fig{display:flex;flex-direction:column;gap:10px;margin:0}
.fig figcaption{font-weight:600}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 24px}
.legend li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.mkn{width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);display:inline-grid;place-items:center;font-size:12px;font-weight:600;font-family:var(--f-sans)}
.shot-sec{display:flex;flex-direction:column;gap:22px}
@media (max-width:900px){
  .app{display:block}
  #side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  #side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
    padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px))}
  .topbar .tt{font-family:var(--f-serif);font-weight:600;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .tp{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
  .content{padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:23px}
  .rhead{grid-template-columns:auto minmax(0,1fr)}
  .rhead .seg{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr)}
  .seg button{padding:7px 4px;font-size:12px;white-space:normal;line-height:1.2}
  .mrow{grid-template-columns:minmax(0,1fr) 70px;row-gap:6px}
  .mrow .bw{grid-column:1/-1;order:3}
  .stat{border-bottom:1px solid var(--line)}
  .princ li{grid-template-columns:30px minmax(0,1fr)}
  .princ li .linkbtn{grid-column:2}
}
.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .45s ease;padding:16px}
.loader.out{opacity:0;pointer-events:none}
.lcard{width:min(460px,100%);display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 26px 20px;background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(14,42,102,.18)}
.lcard img{width:100%;height:auto;display:block;animation:lfloat 2.4s ease-in-out infinite}
.lbar{width:100%;height:6px;border-radius:3px;background:#E3E9F4;overflow:hidden}
.lbar i{display:block;height:100%;width:38%;border-radius:3px;background:linear-gradient(90deg,#0B79F2,#FF8A00);animation:lslide 1.3s ease-in-out infinite}
.lcard p{margin:0;font-size:13.5px;color:#20325F;font-weight:500}
@keyframes lfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lslide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rtitle .car,#side{transition:none}.lcard img,.lbar i{animation:none}.lbar i{width:100%}.loader{transition:none}}
</style>

<script>
"use strict";
/* ============ CONTENIDO DE LA GUÍA ============ */
// Cada requisito: [título, descripción, ejemplo, recomendación, criterio de cumplimiento]
const MODS = [
{id:1,name:"Análisis del problema y definición del sistema",short:"Análisis del problema",
 imp:"Un sistema sin un problema claro termina siendo un conjunto de pantallas. Esta etapa fija qué se construye, para quién y por qué, y es la referencia contra la que se evalúa todo lo demás.",
 obj:"Documentar el problema, los objetivos, los requerimientos, los actores y los casos de uso antes de escribir código.",
 fund:"Las funcionalidades implementadas deben corresponderse con los casos de uso definidos en el análisis.",
 groups:[
 {id:"1.1",name:"Identificación del problema",why:"Define la razón de ser del proyecto y evita construir una solución para un problema que nadie tiene.",reqs:[
  ["Descripción del problema y beneficiario","Redacta qué falla hoy y a quién afecta, identificando la institución, empresa o comunidad beneficiaria con nombre y contexto.","La Coordinación de Pasantías registra solicitudes en hojas de cálculo; se extravían y no hay seguimiento del estado.","Describe el problema sin mencionar tecnología ni la solución.","Una persona ajena al proyecto entiende el problema y quién lo sufre después de leer un párrafo."],
  ["Situación actual del proceso","Describe cómo se realiza hoy el proceso: pasos, responsables, herramientas y tiempos.","El estudiante entrega un formato en papel, secretaría lo transcribe a Excel y luego lo reenvía por correo al tutor.","Entrevista a quienes ejecutan el proceso y conserva evidencia (formatos, capturas, notas).","Existe una descripción del proceso actual validada por al menos un usuario real."],
  ["Consecuencias y necesidad del sistema","Explica qué ocurre si el problema continúa y por qué un sistema informático es la respuesta adecuada.","Demoras de dos semanas, solicitudes perdidas, imposibilidad de generar estadísticas para la dirección.","Cuantifica con datos reales o estimaciones razonadas; evita afirmaciones genéricas.","Las consecuencias están enunciadas y la necesidad del sistema se deduce de ellas."],
  ["Justificación del proyecto","Argumenta la relevancia, el beneficio esperado y la viabilidad técnica y de tiempo del proyecto.","El sistema reduce el tiempo de trámite, centraliza la información y es viable con el equipo y plazo del curso.","Relaciona la justificación con los beneficios medibles para la institución.","La justificación conecta el problema, el beneficio y la viabilidad sin contradicciones."]]},
 {id:"1.2",name:"Definición de objetivos",why:"Los objetivos son el compromiso del proyecto: lo que se promete es lo que se evalúa.",reqs:[
  ["Objetivo general y objetivos específicos","Un objetivo general redactado con verbo en infinitivo y objetivos específicos medibles que lo desglosan.","General: desarrollar un sistema web para gestionar solicitudes de pasantías. Específico: permitir registrar, aprobar y consultar solicitudes.","Redacta cada objetivo específico de modo que pueda verificarse con una funcionalidad concreta.","Cada objetivo específico se corresponde con al menos un módulo o funcionalidad del sistema."],
  ["Alcance y limitaciones","Delimita qué incluye y qué no incluye el sistema, y las restricciones de tiempo, recursos o tecnología.","Incluye registro y aprobación de solicitudes; no incluye pagos ni integración con el sistema académico.","Un alcance honesto protege al equipo: lo que no se declara se espera completo.","El alcance y las limitaciones están escritos y son coherentes con el sistema entregado."],
  ["Beneficiarios directos e indirectos","Identifica quiénes usan el sistema (directos) y quiénes se benefician de sus resultados (indirectos).","Directos: coordinadores y estudiantes. Indirectos: empresas receptoras y la dirección de la facultad.","Distingue usuarios que operan el sistema de quienes solo reciben sus resultados.","Los beneficiarios están listados y se relacionan con los actores del sistema."]]},
 {id:"1.3",name:"Requerimientos del sistema",why:"Los requerimientos traducen el problema en condiciones verificables que el sistema debe cumplir.",reqs:[
  ["Requerimientos funcionales","Lista lo que el sistema debe hacer, redactado como acciones verificables y numeradas.","RF-03: el sistema permitirá a un estudiante registrar una solicitud indicando empresa, fecha de inicio y tutor.","Numera los requerimientos para poder trazarlos hasta los casos de uso y las pantallas.","Cada requerimiento funcional es verificable, único y está asociado a un objetivo específico."],
  ["Requerimientos no funcionales","Describe las cualidades del sistema: restricciones técnicas, estándares, plataforma y condiciones de operación.","RNF-01: el sistema funcionará en navegadores modernos sin instalar software adicional.","Evita términos vagos como «rápido» o «fácil»; define un valor o criterio medible.","Los requerimientos no funcionales son medibles y cada uno puede comprobarse con una prueba."],
  ["Requerimientos de seguridad","Define autenticación, roles, protección de datos, auditoría y cualquier norma que deba cumplirse.","RS-02: las contraseñas se almacenarán con hash; solo el rol Coordinador podrá aprobar solicitudes.","Parte de los actores y de los datos sensibles identificados en el análisis.","Hay requerimientos de seguridad explícitos que luego se implementan y se pueden probar."],
  ["Requerimientos de disponibilidad y rendimiento","Establece cuánto tiempo debe estar disponible el sistema y qué tiempos de respuesta se esperan.","Disponible en horario académico; las consultas de listados responden en menos de 3 segundos con 5000 registros.","Usa el volumen de datos y de usuarios esperado, no cifras arbitrarias.","Existen metas de disponibilidad y rendimiento con valores y un modo de comprobarlas."],
  ["Requerimientos de usabilidad y mantenimiento","Indica quién usará el sistema y su nivel técnico, y cómo se mantendrá y documentará el código.","Un usuario nuevo registra una solicitud en menos de 5 minutos sin capacitación; el código está documentado y versionado.","Define la usabilidad según el perfil real de los usuarios.","Se describen metas de usabilidad y prácticas de mantenimiento aplicables al proyecto."]]},
 {id:"1.4",name:"Identificación de actores",why:"Los actores determinan quién puede hacer qué; de ellos se derivan los roles, los permisos y las pantallas.",reqs:[
  ["Actores identificados y descritos","Lista cada tipo de usuario o sistema externo que interactúa con la aplicación y describe su responsabilidad.","Administrador, Coordinador, Estudiante y Supervisor, con una frase sobre su función.","Define actores por el rol que cumplen, no por personas concretas.","Cada actor tiene nombre, descripción y funciones; no faltan actores que aparezcan en los casos de uso."],
  ["Actores correspondientes a funciones reales","Los actores deben corresponderse con funciones que realmente desempeñan dentro del sistema.","No se define «Supervisor» si ninguna funcionalidad lo requiere.","Elimina actores decorativos y fusiona los que tengan los mismos permisos.","Cada actor aparece en al menos un caso de uso y viceversa."]]},
 {id:"1.5",name:"Casos de uso",why:"Los casos de uso son el puente entre el análisis y el sistema construido; permiten verificar que nada falta ni sobra.",reqs:[
  ["Diagrama de casos de uso","Representa gráficamente actores, casos de uso y sus relaciones dentro de los límites del sistema.","Diagrama UML con Estudiante→Registrar solicitud y Coordinador→Aprobar solicitud.","Mantén un nivel de detalle legible; usa include y extend solo cuando aporten claridad.","El diagrama es legible, usa notación correcta y cubre los requerimientos funcionales."],
  ["Descripción de casos de uso","Para cada caso: actor responsable, flujo principal y flujos alternativos.","Flujo alternativo: la solicitud ya existe para ese periodo, el sistema informa y no la duplica.","Usa una plantilla única para todos los casos.","Cada caso de uso tiene actor, flujo principal y al menos un flujo alternativo o de excepción."],
  ["Precondiciones y postcondiciones","Indica qué debe cumplirse antes de ejecutar el caso y qué estado queda después.","Pre: el usuario inició sesión como Estudiante. Post: la solicitud queda en estado «Pendiente».","Las postcondiciones deben coincidir con cambios reales en la base de datos.","Todos los casos de uso tienen precondiciones y postcondiciones consistentes con el modelo de datos."],
  ["Trazabilidad entre casos de uso y funcionalidades","Verifica que cada caso de uso esté implementado y que cada funcionalidad corresponda a un caso de uso.","Tabla: CU-04 Aprobar solicitud → pantalla «Solicitudes pendientes», botón Aprobar, tabla solicitudes.","Construye una matriz casos de uso × pantallas y revísala antes de presentar.","No hay casos de uso sin implementar ni funcionalidades que no existan en el análisis."]]}
 ]},
{id:2,name:"Diseño y construcción de la base de datos",short:"Base de datos",
 imp:"La base de datos es el núcleo del sistema: de su calidad dependen la integridad, el rendimiento y la confiabilidad de toda la información.",
 obj:"Diseñar un modelo estructurado, normalizado y consistente que responda a las necesidades de información del análisis, y documentarlo.",
 fund:"El modelo de datos debe corresponderse con los requerimientos funcionales, los casos de uso y las funcionalidades implementadas.",
 groups:[
 {id:"2.1",name:"Diseño estructural",why:"Un buen diseño estructural evita reconstruir tablas cuando el sistema ya está en marcha.",reqs:[
  ["Entidades, tablas y atributos","Identifica las entidades del problema, conviértelas en tablas y define los atributos de cada una.","Entidades: Usuario, Solicitud, Empresa, Tutor. Atributos de Solicitud: fecha_inicio, fecha_fin, estado.","Deriva las entidades de los sustantivos de los requerimientos y casos de uso.","Cada tabla representa una entidad real y cada dato requerido por el análisis tiene un atributo."],
  ["Claves primarias y foráneas","Define una clave primaria por tabla y claves foráneas para cada relación.","solicitud.id_usuario es clave foránea hacia usuario.id_usuario.","Prefiere claves sustitutas estables y evita claves con significado que cambie.","Todas las tablas tienen clave primaria y todas las relaciones están representadas con claves foráneas."],
  ["Relaciones y cardinalidades","Establece cómo se relacionan las entidades (1:1, 1:N, N:M) y resuelve las N:M con tablas intermedias.","Un estudiante tiene muchas solicitudes; una solicitud pertenece a un solo estudiante (1:N).","Una relación N:M exige una tabla asociativa con sus propios atributos.","Las cardinalidades son correctas, están documentadas y no existen relaciones N:M sin resolver."],
  ["Restricciones de integridad","Define restricciones que impidan datos inválidos: NOT NULL, UNIQUE, CHECK, DEFAULT.","CHECK (fecha_fin >= fecha_inicio); UNIQUE (cedula).","Declara la restricción en la base de datos y no solo en el formulario.","Las reglas más importantes del negocio están protegidas por restricciones en el motor de base de datos."]]},
 {id:"2.2",name:"Normalización",why:"La normalización reduce redundancia y evita anomalías, pero debe aplicarse con criterio y no de forma mecánica.",reqs:[
  ["Primera forma normal (1FN)","Cada campo contiene un valor atómico y no existen grupos repetitivos.","No guardar «telefono1, telefono2, telefono3»; crear una tabla telefono_usuario.","Si un campo contiene listas separadas por comas, normalízalo.","No hay campos multivaluados ni columnas repetidas en ninguna tabla."],
  ["Segunda forma normal (2FN)","Los atributos dependen de toda la clave primaria, no de una parte de ella.","En detalle_pedido(id_pedido,id_producto,nombre_producto) el nombre depende solo de id_producto: va en producto.","Revisa especialmente las tablas con claves compuestas.","Ningún atributo no clave depende de una parte de una clave compuesta."],
  ["Tercera forma normal (3FN)","Los atributos no clave dependen solo de la clave y no de otros atributos no clave.","En empleado(id,id_depto,nombre_depto) el nombre depende de id_depto: va en departamento.","Pregúntate: si cambia este dato, ¿en cuántos lugares debo corregirlo?","No existen dependencias transitivas; cada hecho se almacena en un solo lugar."],
  ["Sin redundancias ni anomalías","Se evita duplicar datos y se previenen anomalías de inserción, actualización y eliminación. Las formas superiores solo si el sistema las justifica.","Se puede registrar una empresa sin tener solicitudes; borrar una solicitud no elimina la empresa.","Desnormaliza solo con justificación escrita (por ejemplo, rendimiento en reportes).","Se puede insertar, modificar y eliminar sin pérdida ni contradicción de datos; las excepciones están justificadas."]]},
 {id:"2.3",name:"Integridad de los datos",why:"La integridad garantiza que los datos sigan siendo correctos aunque falle un formulario o se acceda sin la interfaz.",reqs:[
  ["Integridad de entidad y referencial","Toda fila es identificable (clave primaria no nula) y toda clave foránea apunta a un registro existente.","No puede existir una solicitud con id_usuario inexistente.","Activa explícitamente las claves foráneas del motor (en SQLite requiere PRAGMA foreign_keys=ON).","Al intentar insertar una clave foránea inválida, el motor rechaza la operación."],
  ["Integridad de dominio","Cada campo acepta solo valores permitidos mediante tipos, CHECK, enumeraciones o tablas de catálogo.","estado solo admite 'Pendiente','Aprobada','Rechazada'; monto > 0.","Prefiere tablas de catálogo cuando los valores puedan cambiar.","Insertar valores fuera de dominio directamente en la base de datos es rechazado."],
  ["Unicidad y obligatoriedad","Define qué campos no pueden repetirse y cuáles no pueden quedar vacíos.","Correo y cédula únicos; nombre y fecha de solicitud obligatorios.","Considera índices únicos compuestos cuando la unicidad dependa de varios campos.","Los campos únicos y obligatorios están declarados con UNIQUE y NOT NULL."],
  ["Restricciones en la base de datos, no solo en formularios","Las restricciones importantes deben existir también en el motor; los formularios son solo una ayuda.","Un script que inserta un correo duplicado debe fallar aunque el formulario no se use.","Prueba insertando datos inválidos directamente con una herramienta de consulta.","Las pruebas directas sobre la base de datos confirman que las reglas críticas se aplican sin el formulario."]]},
 {id:"2.4",name:"Tipos de datos",why:"Tipos adecuados ahorran espacio, aceleran consultas y evitan errores de ordenamiento y cálculo.",reqs:[
  ["Tipos de datos apropiados por campo","Usa el tipo específico para identificadores, nombres, correos, teléfonos, fechas, números, montos, estados y observaciones.","Fechas como DATE, montos como DECIMAL(10,2), estados como catálogo, observaciones como TEXT; no todo como VARCHAR.","Los montos nunca deben usar tipos de punto flotante; los teléfonos y cédulas son texto, no números.","Ningún campo con tipo específico disponible está almacenado como texto genérico sin justificación."]]},
 {id:"2.5",name:"Relaciones y consistencia",why:"Las reglas de eliminación y las transacciones evitan datos huérfanos y operaciones a medias.",reqs:[
  ["Reglas de eliminación y actualización","Define para cada clave foránea qué sucede al eliminar o modificar el registro padre: RESTRICT, CASCADE, SET NULL.","Eliminar un usuario con solicitudes se rechaza (RESTRICT); eliminar una solicitud elimina sus adjuntos (CASCADE).","Usa CASCADE con cautela; en datos históricos prefiere RESTRICT o eliminación lógica.","Cada clave foránea tiene una regla definida y probada."],
  ["Uso de transacciones","Las operaciones que modifican varias tablas se ejecutan de forma atómica: o todo se guarda o nada.","Registrar solicitud y sus adjuntos dentro de una sola transacción con rollback ante cualquier error.","Cierra o revierte siempre la transacción; no la dejes abierta ante una excepción.","Un fallo a mitad de una operación múltiple no deja datos parciales."],
  ["Consistencia entre registros relacionados","Las claves foráneas corresponden a registros existentes y las actualizaciones mantienen la coherencia.","El total de una factura coincide con la suma de sus detalles.","Evita guardar datos derivados; si debes guardarlos, define cómo se mantienen actualizados.","No existen registros huérfanos ni datos contradictorios tras las operaciones del sistema."]]},
 {id:"2.6",name:"Documentación de la base de datos",why:"Sin documentación nadie, incluido el propio equipo, puede mantener ni evaluar el modelo.",reqs:[
  ["Modelo entidad-relación","Diagrama que muestra entidades, atributos, claves, relaciones y cardinalidades.","Diagrama generado con una herramienta de modelado y exportado como imagen.","Debe coincidir con la base de datos real, no con una versión anterior.","El diagrama es legible y refleja exactamente las tablas existentes."],
  ["Diccionario de datos","Descripción de cada tabla y campo: tipo, longitud, clave, restricciones, obligatoriedad y significado.","Tabla solicitud.estado: VARCHAR(12), NOT NULL, valores permitidos, descripción.","Mantenlo como tabla en el documento final, no como texto disperso.","Todos los campos de todas las tablas están descritos."],
  ["Script de creación de la base de datos","Archivo SQL que crea tablas, claves, restricciones, índices y datos iniciales.","Un script que, ejecutado en un servidor vacío, deja la base lista para usar.","Versiona el script junto al código y evita que dependa de datos manuales.","Ejecutar el script desde cero reproduce la base de datos completa."]]},
 {id:"2.7",name:"Seguridad de la base de datos",why:"La base de datos concentra la información sensible; un descuido aquí compromete todo el sistema.",reqs:[
  ["Credenciales y control de acceso","Credenciales fuertes, protegidas en variables de entorno o archivos fuera del repositorio y del directorio público.","Cadena de conexión en un archivo .env excluido del control de versiones.","Nunca subas contraseñas al repositorio ni las dejes en el código fuente.","Las credenciales no aparecen en el código, el repositorio ni archivos accesibles desde la web."],
  ["Consultas parametrizadas y prevención de inyección SQL","Toda consulta con datos del usuario usa parámetros o ORM; nunca concatenación de texto.","SELECT * FROM usuario WHERE correo = ? con el valor enviado como parámetro.","Revisa todo el código buscando consultas armadas con concatenación.","Probar con entradas como ' OR '1'='1 no altera ni expone información."],
  ["Permisos separados y protección de datos sensibles","La aplicación usa un usuario de base de datos con los privilegios mínimos necesarios; los datos sensibles se protegen.","Usuario de aplicación con SELECT/INSERT/UPDATE, sin DROP ni acceso a otras bases.","No uses el usuario administrador (root/sa) en la aplicación.","La cuenta de la aplicación no tiene privilegios administrativos y los datos sensibles no se almacenan en claro."]]}
 ]},
{id:3,name:"Sistema de autenticación y seguridad de acceso",short:"Autenticación y seguridad",
 imp:"Si el sistema administra información de personas o procesos reales, debe asegurar que solo quienes corresponden puedan acceder y hacer cada operación.",
 obj:"Identificar de manera segura a los usuarios y restringir cada acción a los permisos que su rol tiene, validándolo siempre en el servidor.",
 fund:"El sistema de autenticación debe corresponderse con los actores, los casos de uso y los permisos definidos durante el análisis.",
 groups:[
 {id:"3.1",name:"Inicio de sesión",why:"Es la puerta del sistema y el primer lugar donde se prueban sus defensas.",reqs:[
  ["Formulario y validación de credenciales","Formulario de inicio con identificador y contraseña, y validación de ambos en el servidor.","Correo y contraseña verificados contra el hash almacenado en el servidor.","Compara contraseñas con la función de verificación del algoritmo de hash, no con comparación de texto.","El acceso solo se concede con credenciales correctas y se valida siempre en el servidor."],
  ["Mensajes de error apropiados","Los mensajes informan al usuario sin revelar si falló el usuario o la contraseña.","«Credenciales incorrectas» para cualquier caso, no «El usuario no existe».","Los errores técnicos se registran internamente y al usuario se le muestra un mensaje genérico.","Los mensajes son comprensibles y no filtran información útil a un atacante."],
  ["Manejo seguro de sesiones y cierre de sesión","Identificadores de sesión no predecibles, cookies protegidas (HttpOnly, Secure, SameSite) y cierre de sesión que destruye la sesión.","Tras cerrar sesión, volver atrás en el navegador no permite ver páginas protegidas.","Regenera el identificador de sesión al autenticarse.","La sesión se invalida en el servidor al cerrar sesión y expira por inactividad."]]},
 {id:"3.2",name:"Protección de contraseñas",why:"Una filtración de contraseñas en texto plano expone también las cuentas del usuario en otros servicios.",reqs:[
  ["Contraseñas con hash seguro","Almacena solo el hash de la contraseña con Argon2id, bcrypt o un algoritmo equivalente con sal.","password_hash() en PHP, bcrypt en Node, passlib en Python.","No uses MD5, SHA-1 ni SHA-256 simple para contraseñas, ni cifrado reversible.","Ninguna contraseña está almacenada en texto plano ni con un hash rápido sin sal."],
  ["Sin exposición de credenciales","Las contraseñas y credenciales no aparecen en registros, mensajes de error ni archivos públicos.","Los logs no incluyen el cuerpo de la petición de inicio de sesión.","Revisa logs, respaldos y archivos de configuración accesibles por web.","Una búsqueda en logs, errores y archivos públicos no revela contraseñas ni claves."]]},
 {id:"3.3",name:"Control de acceso",why:"Ocultar un botón no es seguridad: el servidor debe negarse a ejecutar lo que el rol no permite.",reqs:[
  ["Control de acceso basado en roles o permisos","Cada actor tiene un rol con funcionalidades específicas y solo accede a ellas.","Administrador gestiona usuarios; Operador registra; Consulta solo visualiza.","Define una matriz rol × funcionalidad y úsala como fuente de verdad.","La matriz de permisos coincide con los actores del análisis y está implementada."],
  ["Protección de rutas y operaciones en el servidor","Cada ruta y cada operación (crear, editar, eliminar) valida la sesión y el permiso en el servidor.","Un usuario de consulta que envía una petición POST de eliminación recibe un error 403.","Prueba accediendo por URL directa y con herramientas de petición HTTP, no solo con la interfaz.","Ninguna operación protegida funciona con un rol no autorizado, aunque se omita la interfaz."],
  ["Restricción de información no autorizada","Un usuario solo puede ver y modificar los registros que le corresponden.","Un estudiante no puede ver solicitudes de otros cambiando el id en la URL.","Verifica la propiedad del registro en cada consulta, no solo el rol.","Cambiar identificadores en la URL o en la petición no revela datos de otros usuarios."]]},
 {id:"3.4",name:"Seguridad adicional",why:"Son defensas que, según el contexto, evitan los ataques web más frecuentes.",reqs:[
  ["Protección contra fuerza bruta y registro de intentos","Limita los intentos de acceso fallidos y registra los intentos de acceso.","Bloqueo temporal tras 5 intentos fallidos; registro de IP y fecha.","El bloqueo no debe permitir que un tercero deje fuera a un usuario legítimo de forma indefinida.","Intentos repetidos son limitados o retardados y quedan registrados."],
  ["Recuperación y cambio de contraseña, expiración de sesión","Mecanismo seguro para recuperar y cambiar contraseñas y sesiones que expiran.","Enlace de recuperación de un solo uso con vencimiento de 30 minutos.","Pide la contraseña actual al cambiarla y cierra otras sesiones abiertas.","Los mecanismos existen cuando el contexto los requiere o están justificados como no aplicables."],
  ["Protección XSS y validación de entradas","Escape de toda salida contra XSS y validación de toda entrada del usuario.","Un comentario con <script> se muestra como texto inofensivo.","Usa las protecciones del framework en lugar de escribirlas manualmente.","Las pruebas de inyección de scripts no funcionan y toda entrada se valida en el servidor."],
  ["HTTPS y autenticación multifactor cuando corresponda","HTTPS en producción y MFA si el riesgo de la información lo justifica.","Certificado válido en el servidor de producción; MFA para el rol Administrador.","Si la autenticación multifactor no aplica, justifícalo con el nivel de riesgo.","El sistema en producción opera sobre HTTPS y la decisión sobre MFA está argumentada."]]}
 ]},
{id:4,name:"Dashboard, navegación y estructura general",short:"Dashboard y navegación",
 imp:"Después del ingreso, el dashboard es la cara del sistema: define si el usuario encuentra rápido lo que necesita.",
 obj:"Ofrecer un panel principal con navegación clara y coherente con los permisos de cada usuario.",
 fund:"La estructura de navegación debe ser uniforme y reflejar los permisos definidos para cada actor.",
 groups:[
 {id:"4.1",name:"Dashboard principal",why:"Es el punto de partida desde el cual el usuario llega a cada módulo.",reqs:[
  ["Panel principal con patrón de navegación definido","Un dashboard con menú lateral, horizontal, superior o combinado, según las necesidades del sistema.","Menú lateral con los módulos y encabezado con usuario y cierre de sesión.","Elige el patrón según la cantidad de módulos y el tipo de usuario.","Existe un panel principal desde el que se accede a todos los módulos permitidos."]]},
 {id:"4.2",name:"Elementos del dashboard",why:"El usuario debe saber siempre dónde está, quién es y qué puede hacer.",reqs:[
  ["Identificación del sistema y del usuario","Nombre del sistema, logotipo institucional, usuario autenticado, rol, acceso al perfil y cierre de sesión.","Encabezado con logo, nombre del sistema, «María Pérez · Coordinadora» y menú de perfil.","Mantén estos elementos en la misma posición en todas las pantallas.","Se muestran usuario y rol, y el cierre de sesión es accesible desde cualquier pantalla."],
  ["Indicadores, resumen y notificaciones relevantes","Indicadores y resúmenes útiles para el rol, y notificaciones cuando el proceso las requiera.","Solicitudes pendientes de aprobación en el panel del Coordinador.","Cada indicador debe responder a una decisión que el usuario toma.","Los indicadores provienen de datos reales y son pertinentes para el rol."]]},
 {id:"4.3",name:"Navegación",why:"Una navegación confusa hace que un sistema correcto parezca defectuoso.",reqs:[
  ["Navegación clara, consistente y organizada","Misma estructura de menú y rutas en todas las pantallas, con nombres comprensibles.","El módulo «Solicitudes» se llama igual en el menú, el título de la página y los reportes.","Evita más de tres niveles de navegación y marca claramente la sección activa.","Un usuario nuevo llega a cada función sin ayuda y siempre sabe dónde está."],
  ["Navegación coherente con los permisos","El menú muestra solo lo que el rol puede usar; el servidor lo valida igualmente.","El usuario de consulta no ve opciones de administración, y la URL directa tampoco funciona.","Genera el menú desde la matriz de permisos y no lo repitas por pantalla.","Cada rol ve únicamente las opciones que le corresponden."],
  ["Pantallas conectadas sin callejones sin salida","Todas las pantallas se alcanzan desde la navegación y permiten volver o continuar.","Después de guardar, el sistema redirige al listado con un mensaje de confirmación.","Prueba cada flujo completo sin usar el botón «atrás» del navegador.","No existen pantallas huérfanas ni flujos que obliguen a editar la URL."]]}
 ]},
{id:5,name:"Diseño visual, identidad e interfaz de usuario",short:"Diseño e interfaz",
 imp:"Una interfaz coherente comunica profesionalidad y reduce errores. Pantallas con estilos distintos parecen aplicaciones diferentes.",
 obj:"Lograr una identidad visual consistente, fácil de usar, accesible y adaptable a distintos dispositivos y navegadores.",
 fund:"Todas las pantallas deben mantener un mismo patrón de diseño y funcionar en los dispositivos y navegadores indicados.",
 groups:[
 {id:"5.1",name:"Identidad institucional",why:"El sistema debe parecer parte de la institución para la que se construye.",reqs:[
  ["Logotipo y colores institucionales","Uso del logotipo de la institución o empresa y de sus colores en el diseño.","Logo en el encabezado y en los reportes; color primario institucional en botones y menú.","Solicita el manual de identidad o los colores oficiales a la institución.","El logotipo y los colores corresponden a la identidad definida por la institución."],
  ["Paleta de colores consistente","Una paleta limitada y definida, aplicada de forma uniforme.","Un color primario, un secundario, neutros y colores de estado (éxito, alerta, error).","Define los colores como variables y evita valores sueltos en cada pantalla.","Todas las pantallas usan la misma paleta."]]},
 {id:"5.2",name:"Consistencia visual",why:"La consistencia hace que lo aprendido en una pantalla sirva en todas las demás.",reqs:[
  ["Tipografía y jerarquía","Una o dos familias tipográficas y tamaños de título uniformes.","Títulos de página de 24 px y subtítulos de 18 px en todas las pantallas.","Define una escala tipográfica y respétala.","Los títulos y textos tienen el mismo estilo en todo el sistema."],
  ["Botones, formularios y tablas uniformes","Mismos estilos de botones, estructura de formularios, diseño de tablas y espaciados.","El botón principal siempre es del mismo color y está en la misma posición.","Crea componentes reutilizables en lugar de copiar estilos.","Formularios y tablas de módulos distintos son visualmente equivalentes."],
  ["Iconografía, colores de estado y alertas","Un solo estilo de iconos, colores de estado fijos y un mismo patrón para mensajes de alerta.","Verde para éxito, ámbar para advertencia, rojo para error en todo el sistema.","No mezcles librerías de iconos de estilos distintos sin una razón de diseño.","Los iconos y las alertas son uniformes en todas las pantallas."]]},
 {id:"5.3",name:"Experiencia de usuario",why:"Un sistema difícil de usar no resuelve el problema, aunque funcione.",reqs:[
  ["Claridad, retroalimentación y prevención de errores","Acciones claras, mensajes comprensibles, confirmaciones y ayudas para evitar errores.","Tras guardar aparece «Solicitud registrada»; los campos inválidos se marcan con su explicación.","Escribe los mensajes desde el punto de vista del usuario, indicando cómo corregir el problema.","Cada acción da una respuesta visible y los errores se explican con claridad."],
  ["Accesibilidad y legibilidad","Contraste suficiente, tamaños legibles, etiquetas en los campos y uso por teclado.","Todos los campos tienen etiqueta visible; se puede navegar con la tecla Tab.","Verifica el contraste del texto con una herramienta y no dependas solo del color para comunicar estados.","El contraste es adecuado y las funciones principales se pueden operar con el teclado."]]},
 {id:"5.4",name:"Responsive design",why:"Los usuarios acceden desde teléfonos, tablets y computadoras.",reqs:[
  ["Diseño adaptable con redistribución de elementos","El diseño se reorganiza según el tamaño de pantalla en escritorio, laptop, tablet y teléfono.","El menú lateral pasa a menú desplegable y las tablas se reorganizan o se desplazan en el teléfono.","Reducir el tamaño de la página no es responsive; los elementos deben reorganizarse.","El sistema fue probado en cuatro tamaños de pantalla y no presenta desplazamientos horizontales ni elementos superpuestos."]]},
 {id:"5.5",name:"Compatibilidad",why:"Cada usuario tiene un navegador distinto y el sistema no debe depender de uno solo.",reqs:[
  ["Compatibilidad con navegadores modernos","Funcionamiento correcto en Chrome, Firefox y Edge, y en Safari cuando corresponda.","Las funciones principales fueron probadas en tres navegadores.","Evita funciones exclusivas de un navegador y revisa la compatibilidad de cada API.","Las funcionalidades principales funcionan igual en los navegadores indicados."]]}
 ]},
{id:6,name:"Desarrollo de módulos y operaciones CRUD",short:"Módulos y CRUD",
 imp:"Las operaciones CRUD son el trabajo diario del sistema: registrar, consultar, modificar y administrar los datos de cada entidad.",
 obj:"Implementar para cada entidad las operaciones que su proceso requiere, coherentes con la base de datos y las reglas del negocio.",
 fund:"Cada formulario, consulta y operación debe corresponderse con la estructura de la base de datos y con los casos de uso.",
 groups:[
 {id:"6.1",name:"Formularios de registro (Create)",why:"Un registro mal capturado genera errores en todos los procesos posteriores.",reqs:[
  ["Formularios correspondientes a entidades o procesos","Cada formulario se corresponde con una entidad o proceso y contiene los campos necesarios.","El formulario «Nueva solicitud» tiene empresa, tutor, fecha de inicio y fecha de fin.","No incluyas campos que no existan en el modelo ni omitas campos obligatorios.","Cada formulario guarda correctamente en las tablas correspondientes."],
  ["Campos obligatorios, validación y duplicidad","Identifica los campos obligatorios, valida los datos, muestra errores, evita registros incompletos y duplicados.","Al intentar registrar la misma cédula dos veces, se muestra «La cédula ya está registrada».","Combina la validación en el cliente con la del servidor y la de la base de datos.","No es posible guardar registros incompletos ni duplicados."]]},
 {id:"6.2",name:"Consulta de información (Read)",why:"La información solo es útil si se puede encontrar fácilmente.",reqs:[
  ["Listado, búsqueda, filtro y ordenamiento","Visualizar registros y permitir buscar, filtrar y ordenar.","Listado de solicitudes con búsqueda por nombre, filtro por estado y orden por fecha.","Realiza el filtrado en el servidor cuando el volumen sea grande.","Buscar, filtrar y ordenar arrojan resultados correctos."],
  ["Detalle y paginación","Consultar el detalle de un registro y paginar cuando el volumen lo requiera.","Al seleccionar una solicitud se ve su información y su historial; el listado muestra 20 por página.","Pagina en la consulta (LIMIT/OFFSET), no cargando todos los registros en memoria.","El detalle muestra toda la información relevante y el listado responde bien con el volumen esperado."]]},
 {id:"6.3",name:"Modificación de información (Update)",why:"Los datos cambian; modificarlos mal puede destruir la integridad.",reqs:[
  ["Selección, edición, validación y guardado","Seleccionar un registro, cargar sus datos, modificar, validar y guardar manteniendo la integridad.","Al editar una solicitud se cargan sus datos; al guardar se aplican las mismas validaciones que al crear.","Aplica las mismas reglas de validación en crear y modificar; considera control de cambios simultáneos.","Las modificaciones se guardan correctamente, se validan y no rompen las relaciones."]]},
 {id:"6.4",name:"Eliminación de información (Delete)",why:"Eliminar es irreversible; no siempre es lo correcto para el proceso.",reqs:[
  ["Análisis previo a la eliminación","Evaluar si puede eliminarse, si tiene registros relacionados y si debe conservarse por razones históricas.","Una solicitud aprobada no se elimina porque queda como evidencia administrativa.","Decide por entidad si el eliminar tiene sentido en el proceso.","Para cada entidad existe una decisión justificada sobre si se elimina o se conserva."],
  ["Eliminación lógica y estados","Usar estados (activo, inactivo, anulado, archivado) en lugar de borrar cuando corresponda.","Un usuario inactivo no puede iniciar sesión, pero conserva su historial.","Agrega el campo de estado al modelo y filtra por él en las consultas.","Los procesos que lo requieren usan estados y no borrado físico."],
  ["Confirmación y protección de integridad","Solicitar confirmación y evitar eliminaciones que dejen datos inconsistentes.","Mensaje «¿Eliminar esta solicitud?» y bloqueo si tiene registros dependientes.","La confirmación debe ser parte de la interfaz, y la verificación de dependencias, del servidor.","Eliminar un registro con dependencias no deja datos huérfanos y siempre exige confirmación."]]},
 {id:"6.5",name:"Correspondencia con la base de datos",why:"Es en este punto donde análisis, datos y código demuestran que son un solo sistema.",reqs:[
  ["Coherencia entre modelo, formularios, validaciones y reglas","Campos, relaciones y restricciones coinciden entre el modelo de datos, los formularios, las validaciones, las operaciones CRUD y las reglas de negocio.","Si la base exige fecha_fin ≥ fecha_inicio, el formulario y el servidor aplican la misma regla.","Revisa campo por campo: tabla → formulario → validación → consulta.","No hay campos del formulario sin columna ni columnas obligatorias que el formulario no capture."]]}
 ]},
{id:7,name:"Validaciones y reglas de negocio",short:"Validaciones y reglas",
 imp:"Las validaciones protegen la calidad de la información y la seguridad. Una regla de negocio sin validar es solo una intención.",
 obj:"Validar cada dato según su significado, en el cliente para facilitar el uso y obligatoriamente en el servidor para proteger el sistema.",
 fund:"Las validaciones deben responder a las características del problema y no limitarse a verificar que un campo tenga algún valor.",
 groups:[
 {id:"7.1",name:"Campos obligatorios",why:"Es la primera barrera contra los datos incompletos.",reqs:[
  ["Campos vacíos, espacios en blanco y nulos","Impedir el registro cuando un campo obligatorio está vacío, es nulo o contiene solo espacios.","Un nombre con tres espacios se rechaza igual que un nombre vacío.","Recorta los espacios antes de validar.","Ningún campo obligatorio acepta vacíos, nulos ni solo espacios."],
  ["Longitudes mínimas y máximas","Cada campo tiene límites de longitud acordes con su significado y su columna.","Cédula entre 6 y 10 dígitos; observaciones hasta 500 caracteres.","Los límites del formulario deben coincidir con los de la columna.","Valores fuera de los límites se rechazan con un mensaje claro."]]},
 {id:"7.2",name:"Validaciones de texto",why:"Cada tipo de texto tiene reglas propias; una regla universal rechaza datos legítimos.",reqs:[
  ["Reglas específicas por campo de texto","Validar longitud, caracteres permitidos y formato según el campo; nombres, direcciones y observaciones permiten caracteres distintos.","Nombres con tildes, ñ, guiones y apóstrofes aceptados; correo con formato válido; teléfono solo dígitos y símbolos permitidos.","No apliques una expresión regular única a todos los campos.","Cada campo de texto tiene su regla propia y acepta valores legítimos sin permitir contenido peligroso."]]},
 {id:"7.3",name:"Validaciones numéricas",why:"Un monto o cantidad incorrecto se traduce en errores contables y operativos.",reqs:[
  ["Valores numéricos, rangos, decimales y montos","Verificar que sea numérico, esté dentro de rangos, sin negativos cuando no corresponda, con decimales válidos y dentro de los límites del proceso.","Cantidad entera mayor que 0; monto con dos decimales y menor al límite de la caja.","Valida en el servidor y usa el tipo de dato exacto para dinero.","Valores no numéricos, negativos o fuera de rango son rechazados."]]},
 {id:"7.4",name:"Validaciones de fechas",why:"Las fechas incoherentes rompen la lógica de procesos y reportes.",reqs:[
  ["Formato, existencia y rangos de fechas","Validar el formato, que la fecha exista y que esté en un rango permitido (por ejemplo, la fecha de nacimiento no puede ser futura).","El 31/02 se rechaza; una fecha de nacimiento futura se rechaza.","Define explícitamente qué fechas pueden ser pasadas, presentes o futuras.","Fechas inexistentes o fuera de rango no se pueden guardar."],
  ["Coherencia entre fechas","Las fechas relacionadas deben tener sentido entre sí.","La fecha de finalización no puede ser anterior a la fecha de inicio.","Aplica la regla también en la base de datos con CHECK.","Combinaciones incoherentes de fechas son rechazadas."]]},
 {id:"7.5",name:"Validaciones de relaciones",why:"Los datos relacionados deben existir y corresponderse.",reqs:[
  ["Existencia y correspondencia de registros relacionados","Verificar que los registros referenciados existan, que las opciones seleccionadas sean válidas y que las entidades se correspondan.","Un tutor seleccionado debe pertenecer a la empresa elegida.","Valida en el servidor, no confíes en lo que envía una lista desplegable.","Enviar identificadores inexistentes o no relacionados es rechazado."]]},
 {id:"7.6",name:"Validaciones de negocio",why:"Impiden operaciones que contradicen el proceso real.",reqs:[
  ["Reglas de negocio específicas del proceso","Impedir operaciones que contradicen el proceso: inscribir sin cupo, aprobar sin cumplir requisitos, pagos duplicados, finalizar lo que no ha comenzado.","No se puede aprobar una solicitud que no tiene todos los documentos cargados.","Lista las reglas de negocio de los requerimientos y marca dónde se valida cada una.","Cada regla de negocio identificada impide la operación incorrecta y devuelve un mensaje explicativo."],
  ["Validación obligatoria en el servidor","Toda validación que proteja la integridad o la seguridad se ejecuta en el servidor, aunque exista en el cliente.","Enviar una petición HTTP manual con datos inválidos sigue siendo rechazado.","La validación en el cliente es una comodidad; la del servidor es el control.","Las pruebas sin interfaz confirman que el servidor rechaza datos inválidos."]]}
 ]},
{id:8,name:"Reportes, consultas y estadísticas",short:"Reportes y estadísticas",
 imp:"Los datos solo cobran valor cuando se convierten en información útil para tomar decisiones.",
 obj:"Ofrecer reportes, exportaciones y estadísticas relacionados con los objetivos del sistema.",
 fund:"Los reportes y gráficos deben responder a los objetivos del sistema y no ser decorativos.",
 groups:[
 {id:"8.1",name:"Reportes por pantalla",why:"Son el medio más inmediato para consultar información organizada.",reqs:[
  ["Listados, consultas detalladas y resúmenes","Listados, detalles, totales e información agrupada.","Total de solicitudes por estado y por mes.","Calcula totales en la consulta, no manualmente en la interfaz.","Los reportes muestran datos correctos y los totales coinciden con los registros."],
  ["Filtros, búsquedas y ordenamiento en reportes","Permitir acotar y ordenar la información.","Filtrar por rango de fechas y por estado.","Muestra los filtros aplicados en el reporte.","Los filtros modifican correctamente los resultados."]]},
 {id:"8.2",name:"Reportes en PDF",why:"Los PDF permiten entregar información formal fuera del sistema.",reqs:[
  ["Contenido del reporte PDF","Nombre del sistema, identidad institucional, título, fecha de generación, filtros aplicados, encabezados y totales.","Encabezado con logo y título; fecha y filtros bajo el título; fila de totales al final.","Genera el PDF en el servidor con una biblioteca, no capturando la pantalla.","El PDF contiene los elementos indicados y coincide con lo visto en pantalla."],
  ["Legibilidad y trazabilidad del PDF","Presentación profesional, numeración de páginas y usuario que lo genera.","«Página 2 de 5» y «Generado por: María Pérez».","Prueba el PDF con muchos registros para verificar los saltos de página.","El PDF es legible, paginado y se muestra bien con volúmenes grandes."]]},
 {id:"8.3",name:"Exportación de información",why:"Permite llevar los datos a otras herramientas.",reqs:[
  ["Exportación a Excel, CSV o impresión","Según las necesidades, exportar a Excel o CSV, imprimir o descargar documentos.","Botón «Exportar CSV» con los filtros aplicados.","Cuida la codificación (UTF-8) y los separadores.","La exportación abre correctamente en la herramienta destino y respeta los permisos del usuario."]]},
 {id:"8.4",name:"Estadísticas y dashboard",why:"Las estadísticas ayudan a interpretar los datos, siempre que respondan a una pregunta real.",reqs:[
  ["Estadísticas relacionadas con los objetivos","Totales, registros por período o categoría, comparaciones, tendencias e indicadores de desempeño.","Tiempo promedio de aprobación, para evaluar el objetivo de reducir tiempos de trámite.","Cada estadística debe responder a un objetivo específico.","Cada indicador está vinculado a un objetivo del sistema."],
  ["Gráficos adecuados y correctos","Barras, circulares o líneas según el tipo de dato; sin gráficos decorativos.","Líneas para tendencia en el tiempo; barras para comparar categorías.","Etiqueta ejes y unidades y evita gráficos circulares con muchas categorías.","Los gráficos son legibles, usan datos reales y el tipo es el adecuado."]]}
 ]},
{id:9,name:"Administración de usuarios y permisos",short:"Usuarios y permisos",
 imp:"Quien administra las cuentas controla la seguridad de todo el sistema; ese control debe ser seguro y trazable.",
 obj:"Gestionar usuarios, roles y permisos de forma segura y coherente con los actores del análisis.",
 fund:"Los roles administrados deben corresponderse con los actores y permisos definidos en el análisis.",
 groups:[
 {id:"9.1",name:"Gestión de usuarios",why:"Es el ciclo de vida de las cuentas.",reqs:[
  ["Registro, consulta y modificación de usuarios","Crear, consultar y modificar usuarios con validaciones.","Formulario de usuarios con correo único y rol obligatorio.","Aplica las mismas validaciones de seguridad que en el resto del sistema.","El administrador puede gestionar usuarios y los datos quedan válidos."],
  ["Activar, desactivar cuentas y asignar roles","Habilitar o deshabilitar cuentas y asignar roles y permisos sin eliminar usuarios.","Una cuenta desactivada no puede iniciar sesión pero conserva su historial.","Cierra las sesiones activas de un usuario al desactivarlo.","Los cambios de estado y de rol se aplican de inmediato."],
  ["Restablecimiento seguro de contraseñas","Permitir restablecer contraseñas mediante mecanismos seguros.","El administrador genera un enlace temporal; nunca ve la contraseña.","Obliga a cambiar la contraseña en el siguiente ingreso.","Restablecer una contraseña no expone la nueva en texto visible ni la deja almacenada sin protección."]]},
 {id:"9.2",name:"Roles y permisos",why:"Los permisos mal asignados son una de las causas más frecuentes de fallas de seguridad.",reqs:[
  ["Actores, roles y acceso a módulos correspondientes","Cada actor del análisis tiene un rol y acceso solo a los módulos que le corresponden.","Actor «Supervisor» del análisis = rol Supervisor con acceso solo de lectura.","Compara la matriz de permisos con el análisis antes de la presentación.","Los roles implementados son los mismos actores del análisis."],
  ["Protección de operaciones e información sensible","Las operaciones y datos delicados están restringidos y se validan en el servidor.","Solo el administrador puede cambiar roles; un operador no puede ver contraseñas ni datos de otros.","Registra los cambios de permisos en la bitácora.","Un usuario no puede ejecutar operaciones ni ver información de un rol superior."]]},
 {id:"9.3",name:"Perfil del usuario",why:"Permite a cada usuario mantener su información sin recurrir al administrador.",reqs:[
  ["Visualizar y actualizar datos personales; cambiar contraseña","Mostrar información del usuario, permitir actualizar datos autorizados, cambiar contraseña y ver su actividad.","Pantalla de perfil con teléfono editable y cambio de contraseña con la actual.","Los datos que afectan permisos (rol, estado) no deben ser editables por el propio usuario.","El usuario ve y actualiza solo los datos autorizados."],
  ["Impedir modificar información ajena","Un usuario no puede modificar información que no le corresponde.","Cambiar el id del perfil en la petición no permite editar a otra persona.","Toma el identificador del usuario desde la sesión, no desde el formulario.","Las pruebas de manipulación de identificadores no permiten modificar datos de otros usuarios."]]}
 ]},
{id:10,name:"Bitácora y auditoría del sistema",short:"Bitácora y auditoría",
 imp:"Cuando algo sale mal, la bitácora permite saber quién hizo qué, cuándo y sobre qué información.",
 obj:"Registrar de forma segura las acciones relevantes para poder auditar los procesos.",
 fund:"La bitácora debe permitir identificar quién realizó una operación, cuándo la realizó y sobre qué información actuó.",
 groups:[
 {id:"10.1",name:"Registro de actividades",why:"Lo que no se registra no se puede auditar.",reqs:[
  ["Inicio y cierre de sesión","Registrar los accesos y salidas, incluidos los intentos fallidos.","Registro: usuario, fecha, IP y resultado del inicio de sesión.","Registra también los intentos fallidos para detectar ataques.","Cada inicio y cierre de sesión queda registrado."],
  ["Creación, modificación y eliminación de registros","Registrar las operaciones de datos con el registro afectado.","Registro: «María modificó la solicitud 124 el 12/05 a las 10:30».","Si es útil, guarda valores anteriores y nuevos de campos críticos.","Las operaciones CRUD relevantes generan un evento."],
  ["Cambios de permisos, acciones administrativas y operaciones críticas","Registrar todo lo que altera seguridad o procesos importantes.","Cambio de rol de un usuario o restauración de un respaldo.","Define una lista de acciones críticas del sistema y verifica que cada una se registre.","Las acciones críticas siempre quedan registradas."]]},
 {id:"10.2",name:"Información de la bitácora",why:"Un registro incompleto no permite reconstruir los hechos.",reqs:[
  ["Contenido completo del evento","Usuario, acción, fecha y hora, módulo, identificador del registro, resultado e información adicional.","Tabla bitacora(id, usuario, accion, modulo, id_registro, fecha_hora, resultado, detalle).","Usa la hora del servidor y no la del cliente.","Cada evento permite responder: quién, qué, cuándo, dónde y con qué resultado."]]},
 {id:"10.3",name:"Seguridad de la bitácora",why:"Una bitácora modificable no sirve como evidencia.",reqs:[
  ["Protección contra modificación y control de acceso","Los usuarios comunes no pueden modificar ni consultar la bitácora; solo los autorizados.","La aplicación no tiene permisos de UPDATE ni DELETE sobre la tabla de bitácora.","Considera enviarla a un almacenamiento aparte con permisos de solo escritura.","Ningún usuario común puede alterar ni acceder a la bitácora."],
  ["Sin datos sensibles innecesarios","No se almacenan contraseñas ni información sensible que no sea necesaria.","Registrar «cambió su contraseña», nunca el valor de la contraseña.","Enmascara datos personales si deben registrarse.","La bitácora no contiene contraseñas ni datos sensibles innecesarios."],
  ["Políticas de conservación","Se define cuánto tiempo se conserva y cómo se archiva la bitácora.","Conservar 12 meses en línea y archivar en un respaldo después.","Evita que la bitácora crezca sin control y afecte el rendimiento.","Existe una política de conservación escrita."]]}
 ]},
{id:11,name:"Respaldo y restauración",short:"Respaldo y restauración",
 imp:"Un fallo técnico, un error humano o un incidente de seguridad pueden destruir la información; el respaldo es la última defensa.",
 obj:"Contar con respaldos protegidos y un procedimiento de restauración que haya sido probado.",
 fund:"La restauración de un sistema debe probarse, no simplemente asumirse como funcional.",
 groups:[
 {id:"11.1",name:"Respaldos",why:"Sin copias no hay recuperación posible.",reqs:[
  ["Mecanismo y frecuencia de respaldo","Un mecanismo definido con una frecuencia acorde con la rapidez con que cambian los datos.","Respaldo diario automático de la base de datos con script programado.","Define la frecuencia según cuánta información se puede permitir perder.","Existe un mecanismo de respaldo y una frecuencia documentada."],
  ["Identificación, protección y conservación de copias","Copias identificadas por fecha, almacenadas de forma segura y conservadas según una política.","Archivos nombrados respaldo_2026-10-24.sql en una ubicación no pública y con una copia externa.","Una copia en el mismo servidor no protege ante la pérdida del servidor.","Las copias están identificadas, protegidas y fuera del alcance público."]]},
 {id:"11.2",name:"Restauración",why:"Un respaldo que no se puede restaurar no tiene valor.",reqs:[
  ["Procedimiento de restauración documentado","Pasos para recuperar la información ante errores humanos, fallos, pérdida, corrupción o incidentes de seguridad.","Guía de pasos para restaurar la base de datos en un servidor limpio.","Escribe el procedimiento de modo que otra persona pueda ejecutarlo.","Existe un procedimiento escrito para cada tipo de incidente relevante."],
  ["Restauración probada","La restauración se ejecutó realmente y se verificó que los datos recuperados son íntegros.","Se restauró una copia en un entorno de prueba y se compararon los totales de registros.","Programa pruebas periódicas de restauración.","Hay evidencia de al menos una restauración exitosa con verificación de integridad."]]},

const REQS = [], GROUPS = {};
MODS.forEach(m => m.groups.forEach(g => { g.mod = m; g.list = [];
  g.reqs.forEach((r,i) => { const q = {id:g.id+"."+(i+1), title:r[0], desc:r[1], ex:r[2], rec:r[3], crit:r[4], g, m}; REQS.push(q); g.list.push(q); });
  GROUPS[g.id] = g; }));

const KEY = "guia-sistemas-universitarios-v1";
let S = loadState();
function loadState(){
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.req) { j.meta = Object.assign({name:"",student:"",institution:"",accent:PRESETS[0]}, j.meta||{}); j.coh = j.coh||{}; return j; } } catch(e){}
  return {meta:{name:"",student:"",institution:"",accent:PRESETS[0]}, req:{}, coh:{}};
}
let storageOk = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ storageOk = false; } }

function rs(id){ const r = S.req[id]||{}; const s = r.s||"p"; return {s, note:r.note||"", na:r.na||"", naOk: s==="n" && (r.na||"").trim().length>0}; }
function setReq(id, patch){ S.req[id] = Object.assign({}, S.req[id]||{}, patch); save(); }
function stats(list){
  let c=0,d=0,p=0,n=0,bad=0;
  for (const q of list){ const r = rs(q.id);
    if (r.s==="c") c++; else if (r.s==="d") d++; else if (r.s==="n"){ if (r.naOk) n++; else {p++; bad++;} } else p++; }
  const t = list.length, app = t-n;
  return {t,c,d,p,n,bad,app,pct: app ? Math.round(c/app*100) : null};
}
const pctTxt = v => v===null ? "—" : v+"%";
function modDone(m){ const s = stats(m.list); return s.app>0 ? s.c===s.app : s.n===s.t; }
function alerts(){
  const out = [];
  PAIRS.forEach(([a,b,txt]) => {
    const A = stats(GROUPS[a].list), B = stats(GROUPS[b].list);
    if (A.pct===null || B.pct===null) return;
    if (B.c+B.d>0 && A.pct<50) out.push({kind:"up", a, b, txt, msg:"Hay avance en "+b+" «"+GROUPS[b].name+"» pero "+a+" «"+GROUPS[a].name+"» está en "+A.pct+"%. La implementación podría no corresponder al análisis."});
    else if (A.pct===100 && B.c+B.d===0) out.push({kind:"down", a, b, txt, msg:a+" «"+GROUPS[a].name+"» está completo pero "+b+" «"+GROUPS[b].name+"» no se ha iniciado. ¿Falta implementarlo?"});
  });
  REQS.forEach(q => { const r = rs(q.id); if (r.s==="n" && !r.naOk) out.push({kind:"na", id:q.id, txt:"No aplica sin justificación", msg:q.id+" «"+q.title+"» está marcado como No aplica sin justificación, por lo que se cuenta como pendiente."}); });
  return out;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>{t.hidden=true},3200); }
function bar(s, sm){ const t=s.app||1; return '<div class="bar'+(sm?" sm":"")+'" role="img" aria-label="'+s.c+" cumplidos, "+s.d+" en desarrollo de "+s.app+' aplicables"><i class="c" style="width:'+(s.c/t*100)+'%"></i><i class="d" style="width:'+(s.d/t*100)+'%"></i></div>'; }
function pill(k){ return '<span class="pill s-'+k+'">'+ST[k].g+" "+ST[k].l+"</span>"; }
function hexOk(h){ return /^#[0-9a-fA-F]{6}$/.test(h); }
function applyAccent(){
  const h = hexOk(S.meta.accent) ? S.meta.accent : PRESETS[0];
  const r=parseInt(h.slice(1,3),16), g=parseInt(h.slice(3,5),16), b=parseInt(h.slice(5,7),16);
  const lum = (0.299*r+0.587*g+0.114*b)/255;
  const st = document.documentElement.style;
  st.setProperty("--accent", h); st.setProperty("--on-accent", lum>0.62 ? "#111" : "#fff");
}

function makePDF(){
  const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:"mm",format:"a4"});
  const W=210,H=297,M=18,LW=W-2*M; let y=M;
  const hex = hexOk(S.meta.accent)?S.meta.accent:PRESETS[0];

  const col = {p:[107,119,115],d:[168,104,11],c:[27,127,70],n:[79,99,160]};
  const need = h => { if (y+h>H-M-4){ doc.addPage(); y=M; } };
  const text = (s,size,style,color,indent,gap) => { doc.setFont("helvetica",style||"normal"); doc.setFontSize(size); doc.setTextColor.apply(doc,color||[24,33,31]);
    const lines = doc.splitTextToSize(String(s), LW-(indent||0)); const lh = size*0.43;
    lines.forEach(l => { need(lh+1); doc.text(l, M+(indent||0), y); y+=lh+0.9; }); y += (gap||0); };
  doc.setFillColor.apply(doc,acc); doc.rect(0,0,W,5,"F");
  y=16; text("Resumen de avance del proyecto",20,"bold",acc,0,1);
  text(sysName(),13,"bold",null,0,1);
  if (S.meta.student.trim()) text("Estudiante o equipo: "+S.meta.student.trim(),10,"normal",null,0,0);
  if (S.meta.institution.trim()) text("Institución: "+S.meta.institution.trim(),10,"normal",null,0,0);
  text("Fecha de generación: "+today(),10,"normal",[86,99,95],0,4);
  const all = stats(REQS);
  text("Cumplimiento general: "+pctTxt(all.pct),14,"bold",null,0,1);
  text("Total de requisitos: "+all.t+"   Cumplidos: "+all.c+"   En desarrollo: "+all.d+"   Pendientes: "+all.p+"   No aplica (justificados): "+all.n,10,"normal",null,0,3);
  need(8); doc.setDrawColor(213,221,218); doc.line(M,y,W-M,y); y+=5;
  text("Avance por módulo",12,"bold",acc,0,1);
  MODS.forEach(m => { const s=stats(m.list); text(m.id+". "+m.name+" - "+pctTxt(s.pct)+" ("+s.c+" de "+s.app+" aplicables)"+(modDone(m)?" - Finalizado":""),10,"normal",null,2,0); });
  y+=4;
  MODS.forEach(m => {
    need(24); doc.setDrawColor.apply(doc,acc); doc.setLineWidth(0.5); doc.line(M,y,W-M,y); y+=5;
    text("Módulo "+m.id+". "+m.name,13,"bold",acc,0,1);
    text("Avance: "+pctTxt(stats(m.list).pct),10,"normal",[86,99,95],0,2);
    [["c","Cumplidos"],["d","En desarrollo"],["p","Pendientes"],["n","No aplica"]].forEach(([k,lab]) => {
      const items = m.list.filter(q => { const r=rs(q.id); return k==="p" ? (r.s==="p"||(r.s==="n"&&!r.naOk)) : k==="n" ? (r.s==="n"&&r.naOk) : r.s===k; });
      if (!items.length) return;
      text(lab+" ("+items.length+")",10.5,"bold",col[k],0,0.5);
      items.forEach(q => { const r=rs(q.id);
        text(q.id+"  "+q.title,10,"normal",null,3,0);
        if (r.s==="n" && r.na.trim()) text("Justificación: "+r.na.trim(),9,"italic",[86,99,95],9,0);
        if (r.s==="n" && !r.naOk) text("Marcado No aplica sin justificación.",9,"italic",[179,50,31],9,0);
        if (r.note.trim()) text("Observación: "+r.note.trim(),9,"italic",[86,99,95],9,0); });
      y+=2; });
    y+=2;
  });
  const al = alerts();
  if (al.length){ need(20); doc.setDrawColor.apply(doc,acc); doc.line(M,y,W-M,y); y+=5; text("Alertas de coherencia",13,"bold",acc,0,1); al.forEach(a=>text("- "+a.msg,10,"normal",null,2,1)); }
  const n = doc.getNumberOfPages();
  for (let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(120,130,126);
    doc.text(sysName()+" - Guía de Construcción de Sistemas",M,H-9); doc.text("Página "+i+" de "+n,W-M,H-9,{align:"right"}); }
  return doc.output("arraybuffer");
}
