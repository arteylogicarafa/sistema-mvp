const MODSHOT = {2:["bd","integridad"],3:["login","acceso"],4:["dash","menus"],5:["dash","menus"],6:["crud","integridad"],9:["acceso"],10:["bitacora"],11:["resp"]};

function legendHtml(a){ return '<ol class="legend">'+a.map((t,i)=>'<li><span class="mkn">'+(i+1)+"</span><span>"+esc(t)+"</span></li>").join("")+"</ol>"; }
function vPantallas(){
  const sh = SHOTS.find(x=>x.id===shotTab) || SHOTS[0];
  let h = '<header class="mhead"><span class="kicker">Guía visual</span><h1>Pantallas modelo</h1><p class="muted" style="max-width:68ch">Maquetas esquemáticas para entender qué debe tener cada pantalla y cómo se conectan. Son ilustraciones, no plantillas para copiar: tu sistema debe seguir la identidad de tu institución. Los marcadores numerados se explican bajo cada figura.</p></header>';
  h += '<div class="chips" role="group" aria-label="Elegir pantalla">'+SHOTS.map(x=>'<button class="chip" data-act="shot" data-t="'+x.id+'" aria-pressed="'+(x.id===sh.id)+'">'+esc(x.label)+"</button>").join("")+"</div>";
  h += '<div class="shot-sec"><div><h2>'+esc(sh.label)+'</h2><p class="muted">'+esc(sh.intro)+"</p></div>";
  if (sh.id==="crud"){
    h += '<div class="chips" role="group" aria-label="Paso del CRUD">'+[["read","Listar · Read"],["create","Crear · Create"],["update","Editar · Update"],["delete","Eliminar · Delete"]].map(([k,l])=>'<button class="chip" data-act="crudstep" data-t="'+k+'" aria-pressed="'+(crudStep===k)+'">'+l+"</button>").join("")+"</div>";
    h += '<figure class="fig">'+svgCrud(crudStep)+legendHtml(CRUD_LEG[crudStep])+"</figure>";
  } else sh.figs.forEach(f => { h += '<figure class="fig"><figcaption>'+esc(f.t)+"</figcaption>"+f.svg()+(f.leg?legendHtml(f.leg):"")+"</figure>"; });
  if (sh.extra) h += '<p class="small muted">'+esc(sh.extra)+"</p>";
  h += '<p class="small muted">Se verifica en el <button class="linkbtn" data-act="nav" data-v="m'+sh.mod+'">Módulo '+sh.mod+". "+esc(MODS.find(m=>m.id===sh.mod).short)+"</button>.</p></div>";
  return h;
}

/* ============ EVENTOS ============ */
function closeMenu(){ $("side").classList.remove("open"); $("scrim").classList.remove("open"); }
$("menuBtn").addEventListener("click", () => { $("side").classList.add("open"); $("scrim").classList.add("open"); });
$("scrim").addEventListener("click", closeMenu);
$("themeBtn").addEventListener("click", () => setTheme(curTheme()==="dark" ? "light" : "dark"));

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act==="theme") setTheme(el.dataset.t);
  else if (act==="nav") go(el.dataset.v);
  else if (act==="jump"){ const q = REQBYID[id]; openReq.add(id); go("m"+q.m.id, id); }
  else if (act==="setst"){
    const prev = rs(id).s; setReq(id,{s:el.dataset.s}); if (el.dataset.s==="n") openReq.add(id);
    render(); const b = document.querySelector('[data-act="setst"][data-id="'+id+'"][data-s="'+el.dataset.s+'"]'); if (b) b.focus({preventScroll:true});
    if (prev!==el.dataset.s && el.dataset.s==="n") toast("Escribe la justificación para excluirlo del cálculo.");
  }
  else if (act==="toggle"){ openReq.has(id)?openReq.delete(id):openReq.add(id); render(); const b=document.querySelector('[data-act="toggle"][data-id="'+id+'"]'); if (b) b.focus({preventScroll:true}); }
  else if (act==="filter"){ filter = el.dataset.f; render(); }
  else if (act==="shot"){ shotTab = el.dataset.t; render(); }
  else if (act==="crudstep"){ crudStep = el.dataset.t; render(); }
  else if (act==="openshot"){ shotTab = el.dataset.t; go("pantallas"); }
  else if (act==="expand"){ const m = MODS.find(x=>"m"+x.id===view); const ids = m.list.map(q=>q.id); const allOpen = ids.every(i=>openReq.has(i)); ids.forEach(i=>allOpen?openReq.delete(i):openReq.add(i)); render(); }
  else if (act==="accent"){ S.meta.accent = el.dataset.c; save(); applyAccent(); render(); }
  else if (act==="pdf"){ if (!window.jspdf){ toast("No se pudo cargar el generador de PDF."); return; } try { await save_(fname("pdf"), makePDF()); } catch(err){ toast("Error al generar el PDF."); } }
  else if (act==="csv") await save_(fname("csv"), makeCSV());
  else if (act==="json") await save_("copia-guia-sistemas.json", JSON.stringify(S,null,2));
  else if (act==="import") $("impFile").click();
  else if (act==="copy"){
    const t = summaryText(); const box=$("copyBox"), ta=$("copyTa"); ta.value=t;
    try { await navigator.clipboard.writeText(t); toast("Resumen copiado al portapapeles."); }
    catch(err){ box.hidden=false; ta.focus(); ta.select(); toast("Selecciona el texto y cópialo con Ctrl+C."); }
  }
  else if (act==="reset"){
    if (el.dataset.arm){ S = {meta:Object.assign({},S.meta), req:{}, coh:{}}; save(); openReq.clear(); toast("Avance borrado."); render(); }
    else { el.dataset.arm="1"; el.textContent="Confirmar: borrar todo el avance"; setTimeout(()=>{ if(el.isConnected){ delete el.dataset.arm; el.textContent="Borrar todo el avance"; } },5000); }
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.note) setReq(t.dataset.note,{note:t.value});
  else if (t.dataset.na){ setReq(t.dataset.na,{na:t.value}); const w=$("nw-"+t.dataset.na); if (w) w.hidden = t.value.trim().length>0; renderSide(); }
  else if (t.dataset.meta){ const k=t.dataset.meta; if (k==="accent" && !hexOk(t.value)) return; S.meta[k]=t.value; save(); if (k==="accent"){ applyAccent(); } }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.coh!==undefined){ S.coh[t.dataset.coh]=t.checked; save(); render(); }
  else if (t.dataset.meta==="accent"){ render(); }
  else if (t.id==="impFile" && t.files[0]){
    const fr = new FileReader();
    fr.onload = () => { try { const j = JSON.parse(fr.result); if (!j || typeof j.req!=="object") throw 0; S = {meta:Object.assign({name:"",student:"",institution:"",accent:PRESETS[0]},j.meta||{}), req:j.req, coh:j.coh||{}}; save(); applyAccent(); render(); toast("Copia importada."); } catch(err){ toast("El archivo no es una copia válida de esta guía."); } };
    fr.readAsText(t.files[0]); t.value="";
  }
});
document.addEventListener("keydown", e => { if (e.key==="Escape") closeMenu(); });

/* ============ ARRANQUE ============ */
/* Pantalla de carga: espera a que termine de cargar la página (fuentes, PDF, logo) y se muestra un mínimo de 1,4 s */
(function(){
  const ld = $("loader"), t0 = Date.now(); let done = false;
  const hide = () => { if (done) return; done = true; const w = Math.max(0, 1400-(Date.now()-t0)); setTimeout(() => { ld.classList.add("out"); setTimeout(() => { ld.hidden = true; }, 500); }, w); };
  if (document.readyState === "complete") hide(); else window.addEventListener("load", hide);
  setTimeout(hide, 5000);
})();
applyTheme(); applyAccent(); render();
(async () => { try { dl = (await window.claude?.use?.("downloads")) || null; } catch(e){ dl = null; } if (dl && view==="proyecto") render(); })();
</script>
